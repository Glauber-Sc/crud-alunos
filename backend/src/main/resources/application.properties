spring.application.name=crud-alunos-api
server.port=8085

# O SQLite é um arquivo: não precisa criar contêiner separado para banco.
spring.datasource.url=${SQLITE_URL:jdbc:sqlite:/app/data/alunos.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# Executa schema.sql ao iniciar; CREATE TABLE IF NOT EXISTS preserva os dados.
spring.sql.init.mode=always
